<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡派询价工具 · 测试版V2</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #dc2626;
    --ok: #16a34a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header {
    background: linear-gradient(120deg, #1e3a8a, var(--primary));
    color: #fff; padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 760px; margin: 20px auto; padding: 0 16px 40px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 {
    margin: 0 0 14px; font-size: 15px; color: var(--primary-dark);
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .tag {
    font-size: 11px; font-weight: normal; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 1px 8px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  input[readonly] { background: #f3f4f6; color: var(--muted); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .btn {
    display: inline-block; background: var(--primary); color: #fff; border: none;
    padding: 11px 22px; font-size: 15px; border-radius: 8px; cursor: pointer;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn-ghost:hover { background: #eff6ff; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .big-btn { width: 100%; font-size: 16px; padding: 14px; }
  .err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 4px; }
  .field-bad { border-color: var(--danger) !important; }
  .muted { color: var(--muted); font-size: 12px; }
  .dest-info { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .badge {
    display: inline-block; background: #fef9c3; color: #854d0e; border: 1px solid #fde68a;
    border-radius: 20px; padding: 1px 10px; font-size: 12px; margin-left: 8px;
  }
  .result-price { font-size: 34px; font-weight: 700; color: var(--primary-dark); }
  .result-meta { color: var(--muted); font-size: 13px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; margin-top: 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .alert { padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .alert-err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .alert-warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .hidden { display: none; }
  .note-line { font-size: 12px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 6px 10px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>卡派询价工具 <span class="badge">测试版 V2 · 本地报价表</span></h1>
  <p>途兔卡派季度价卡 · 按「目的地 × 托盘数」查表报价（非实时 API）</p>
</header>

<main>
  <!-- ① 发货仓 -->
  <div class="card">
    <h2>① 发货仓 <span class="tag">固定 · 德国自营仓</span></h2>
    <div class="row">
      <div><label>公司</label><input type="text" readonly value="ANTHBOT GER GMBH"></div>
      <div><label>联系人</label><input type="text" readonly value="ANTHBOT GER GMBH"></div>
    </div>
    <div class="row">
      <div style="flex:2"><label>地址</label><input type="text" readonly value="Bussardweg 4, 41468 Neuss, Germany"></div>
      <div><label>电话</label><input type="text" readonly value="+49 (0)152 23942230"></div>
    </div>
  </div>

  <!-- ② 目的地 -->
  <div class="card">
    <h2>② 目的地 <span class="tag">99 个车行 · 本地查表</span></h2>
    <label>搜索 / 选择目的地（按城市、邮编、公司名过滤）</label>
    <input type="text" id="destSearch" placeholder="输入关键词过滤，或直接在下拉选择">
    <select id="destSelect" size="8" style="margin-top:8px;"></select>
    <div class="dest-info" id="destInfo"></div>
    <div class="muted" style="margin-top:6px;">仅支持报价表内 99 个车行；不支持手动输入新地址（表外地址无报价）。</div>
  </div>

  <!-- ③ 托盘数量 -->
  <div class="card">
    <h2>③ 托盘数量 <span class="tag">1–33 托</span></h2>
    <div class="row" style="align-items:flex-end;">
      <div style="max-width:180px;">
        <label>托盘数</label>
        <input type="number" id="palletCount" min="1" max="33" value="1" step="1">
      </div>
      <div style="flex:3;">
        <div class="muted" id="palletRangeHint">标准托盘 120×80×200 cm · 240 kg/托</div>
      </div>
    </div>
    <div class="err" id="palletErr"></div>
  </div>

  <button class="btn big-btn" id="quoteBtn" type="button">计算报价</button>
  <div class="err" id="formErr"></div>

  <!-- 结果 -->
  <div class="card hidden" id="resultCard">
    <h2>报价结果</h2>
    <div id="resultBody"></div>
  </div>
</main>

<script src="price_book.js"></script>
<script>
  "use strict";

  const BOOK = window.PRICE_BOOK || [];
  let selected = null;

  // ================= ② 目的地 =================
  function fillDestSelect() {
    const sel = document.getElementById("destSelect");
    sel.innerHTML = "";
    const byCountry = {};
    BOOK.forEach((e) => { (byCountry[e.countryName] = byCountry[e.countryName] || []).push(e); });
    Object.keys(byCountry).sort().forEach((cn) => {
      const g = document.createElement("optgroup");
      g.label = cn + " (" + byCountry[cn][0].country + ")";
      byCountry[cn].forEach((e) => {
        const o = document.createElement("option");
        o.value = String(e.id);
        o.textContent = e.label + (e.maxPallets === 0 ? "  ⚠无报价" : "");
        g.appendChild(o);
      });
      sel.appendChild(g);
    });
  }

  function destInfoText(e) {
    return [e.countryName, e.postCode, e.city, e.addressLine].filter(Boolean).join(" · ");
  }

  document.getElementById("destSearch").addEventListener("input", function () {
    const kw = this.value.trim().toLowerCase();
    const sel = document.getElementById("destSelect");
    [...sel.querySelectorAll("option")].forEach((o) => {
      const e = BOOK[parseInt(o.value, 10) - 1];
      const hay = (e.label + " " + e.countryName + " " + e.city + " " + e.postCode).toLowerCase();
      o.hidden = !hay.includes(kw);
    });
  });

  document.getElementById("destSelect").addEventListener("change", function () {
    const id = parseInt(this.value, 10);
    selected = BOOK.find((e) => e.id === id) || null;
    document.getElementById("destInfo").textContent =
      selected ? "已选：" + destInfoText(selected) : "";
    const pc = document.getElementById("palletCount");
    const hint = document.getElementById("palletRangeHint");
    const err = document.getElementById("palletErr");
    if (selected && selected.maxPallets === 0) {
      hint.textContent = "该目的地无报价" + (selected.note ? "（" + selected.note + "）" : "");
      pc.value = ""; pc.disabled = true; err.textContent = "";
    } else {
      pc.disabled = false;
      pc.max = selected ? selected.maxPallets : 33;
      hint.textContent = (selected
        ? "该目的地最高 " + selected.maxPallets + " 托"
        : "标准托盘 120×80×200 cm · 240 kg/托");
      err.textContent = "";
    }
  });

  // ================= 报价计算 =================
  function onQuote() {
    const err = document.getElementById("formErr");
    err.textContent = "";
    if (!selected) {
      err.textContent = "请先选择目的地";
      document.getElementById("destSelect").classList.add("field-bad");
      return;
    }
    document.getElementById("destSelect").classList.remove("field-bad");
    if (selected.maxPallets === 0) {
      renderNoQuote(selected);
      return;
    }
    const n = parseInt(document.getElementById("palletCount").value, 10);
    const perr = document.getElementById("palletErr");
    if (isNaN(n) || n < 1) { perr.textContent = "请输入托盘数（≥1）"; return; }
    if (n > selected.maxPallets) {
      perr.textContent = "超出该目的地报价范围（最高 " + selected.maxPallets + " 托）";
      return;
    }
    perr.textContent = "";
    const price = selected.palletPrices[n - 1];
    if (price == null) { renderNoQuote(selected); return; }
    renderResult(selected, n, price);
  }

  function renderNoQuote(e) {
    const body = document.getElementById("resultBody");
    body.innerHTML = `<div class="alert alert-warn">该目的地（${e.label}）暂无报价${e.note ? " —— " + e.note : ""}，请线下确认。</div>`;
    document.getElementById("resultCard").classList.remove("hidden");
  }

  function renderResult(e, n, price) {
    const body = document.getElementById("resultBody");
    const kv = [
      ["目的地", `${e.label}（${e.countryName} · ${e.postCode} ${e.city}）`],
      ["托盘数", n + " 托"],
      ["公路距离", e.distanceKm != null ? e.distanceKm + " km" : "—"],
      ["拼车时效", e.groupageLeadTime ? e.groupageLeadTime + " 工作日" : "—"],
      ["整车时效", e.fullTruckLeadTime ? e.fullTruckLeadTime + " 工作日" : "—"],
    ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    const note = e.note && e.note.indexOf("无服务") < 0
      ? `<div class="note-line">${e.note}</div>` : "";
    body.innerHTML = `
      <div class="row" style="align-items:baseline;">
        <div>
          <div class="result-price">€ ${price}</div>
          <div class="result-meta">运输总价（EUR）</div>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" onclick="copyQuote()">复制报价</button>
      </div>
      <dl class="kv">${kv}</dl>
      ${note}`;
    document.getElementById("resultCard").classList.remove("hidden");
  }

  window.copyQuote = function () {
    const el = document.getElementById("resultBody");
    const txt = el.innerText.replace(/\n+/g, "\n").trim();
    const done = () => alert("已复制到剪贴板");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(txt).then(done).catch(fallback);
    } else fallback();
    function fallback() {
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };

  document.getElementById("quoteBtn").addEventListener("click", onQuote);
  fillDestSelect();
</script>
</body>
</html>
